<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for your interest in Build To Wear. Please complete the next step.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Thank You | Build To Wear">
    <meta property="og:description" content="Thank you for your interest in Build To Wear. Please complete the next step.">
    <meta property="og:image" content="https://buildtowear.com/assets/logo/logo.png">
    <meta property="og:url" content="https://buildtowear.com/thank-you.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Thank You | Build To Wear">
    <meta name="twitter:description" content="Thank you for your interest in Build To Wear. Please complete the next step.">
    <meta name="twitter:image" content="https://buildtowear.com/assets/logo/logo.png">
    <link rel="canonical" href="https://buildtowear.com/thank-you.html">
    <title>Thank You | Build To Wear</title>
    
    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/assets/favicon/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/assets/favicon/safari-pinned-tab.svg" color="#8B7355">
    <meta name="msapplication-TileColor" content="#F7F7F5">
    <meta name="theme-color" content="#F7F7F5">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: var(--color-paper);
            min-height: 100vh;
            font-family: var(--font-sans);
        }
        .thankyou-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;
            background: var(--color-paper);
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px rgba(139, 115, 85, 0.07);
            text-align: center;
            margin-top: 5rem;
        }
        .thankyou-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            color: var(--color-accent);
            margin-bottom: 1rem;
        }
        .thankyou-message {
            font-size: 1.15rem;
            color: var(--color-ink);
            margin-bottom: 2.5rem;
        }
        .thankyou-form {
            width: 100%;
            min-height: 540px;
            display: flex;
            justify-content: center;
        }
        .thankyou-form iframe {
            width: 100%;
            min-height: 540px;
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 2px 8px rgba(139, 115, 85, 0.08);
            background: var(--color-paper);
        }
        @media (max-width: 600px) {
            .thankyou-container {
                padding: 1.2rem 0.2rem 0.5rem 0.2rem;
                border-radius: 0.7rem;
            }
            .thankyou-title {
                font-size: 1.4rem;
            }
            .thankyou-form iframe {
                min-height: 420px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav nav--sticky">
        <div class="container nav__container">
            <a href="/" class="nav__logo">
                <img src="/assets/favicon/logo.svg" alt="Build to Wear Logo">
                <span class="nav__logo-text">Build to Wear</span>
            </a>
            <div class="nav__links">
                <a href="/" class="nav__link">Home</a>
                <a href="/shop.html" class="nav__link">Shop</a>
                <a href="/founders.html" class="nav__link">For Founders</a>
                <a href="/about.html" class="nav__link">About</a>
                <a href="/contact.html" class="nav__link">Contact</a>
            </div>
        </div>
    </nav>

    <main class="thankyou-container">
        <h1 class="thankyou-title">Thanks for your order!</h1>
        <p class="thankyou-message">
        You're one step away from making your hoodie truly yours. <br>
        Fill out the form below so we can craft a design that speaks for you.
        </p>
        <div class="thankyou-form">
            <iframe src="https://form.typeform.com/to/bHy3Hrkf" title="Build To Wear Next Step" allow="camera; microphone; autoplay; encrypted-media;" loading="lazy"></iframe>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
</body>
</html>
